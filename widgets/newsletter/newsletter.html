<div class="newsletter-inner">
  <div class="newsletter-copy">
    <h2>Sign up for our newsletter</h2>
    <p>Get early access to new arrivals, care guides and seasonal offers.</p>
  </div>
  <form class="newsletter-form" novalidate>
    <label class="newsletter-label" for="newsletter-email">Email address</label>
    <div class="newsletter-field">
      <input id="newsletter-email" name="email" type="email" autocomplete="email"
        placeholder="john@gmail.com" required>
      <button type="submit" class="newsletter-submit" aria-label="Subscribe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 12h16" />
          <path d="m14 6 6 6-6 6" />
        </svg>
      </button>
    </div>
    <p class="newsletter-message" role="status" aria-live="polite"></p>
  </form>
</div>
