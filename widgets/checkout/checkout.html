<div class="checkout-inner">
  <h1 class="checkout-heading">Checkout</h1>
  <div class="checkout-empty" hidden>
    <p>Your cart is empty.</p>
    <a class="button primary" href="/category/plants">Continue shopping</a>
  </div>
  <div class="checkout-content" hidden>
    <ul class="checkout-items"></ul>
    <div class="checkout-summary">
      <p><span>Subtotal</span><span class="checkout-subtotal"></span></p>
      <p><span>Shipping</span><span>Free</span></p>
      <p class="checkout-total-row"><span>Total</span><span class="checkout-total-value"></span></p>
    </div>
    <form class="checkout-form" novalidate>
      <h2>Shipping details</h2>
      <div class="checkout-field">
        <label for="checkout-name">Full name</label>
        <input id="checkout-name" name="name" type="text" autocomplete="name" required minlength="2">
        <span class="checkout-field-error" role="alert"></span>
      </div>
      <div class="checkout-field">
        <label for="checkout-email">Email</label>
        <input id="checkout-email" name="email" type="email" autocomplete="email" required>
        <span class="checkout-field-error" role="alert"></span>
      </div>
      <div class="checkout-field">
        <label for="checkout-phone">Phone number</label>
        <input id="checkout-phone" name="phone" type="tel" autocomplete="tel"
          pattern="^[0-9+\-\s()]{7,15}$" required>
        <span class="checkout-field-error" role="alert"></span>
      </div>
      <div class="checkout-field">
        <label for="checkout-address">Address</label>
        <input id="checkout-address" name="address" type="text" autocomplete="street-address" required minlength="5">
        <span class="checkout-field-error" role="alert"></span>
      </div>
      <div class="checkout-field-row">
        <div class="checkout-field">
          <label for="checkout-city">City</label>
          <input id="checkout-city" name="city" type="text" autocomplete="address-level2" required>
          <span class="checkout-field-error" role="alert"></span>
        </div>
        <div class="checkout-field">
          <label for="checkout-state">State / Province</label>
          <input id="checkout-state" name="state" type="text" autocomplete="address-level1" required>
          <span class="checkout-field-error" role="alert"></span>
        </div>
        <div class="checkout-field">
          <label for="checkout-zip">ZIP / Postal code</label>
          <input id="checkout-zip" name="zip" type="text" autocomplete="postal-code"
            pattern="^[A-Za-z0-9\- ]{3,10}$" required>
          <span class="checkout-field-error" role="alert"></span>
        </div>
      </div>
      <div class="checkout-next-steps">
        <h2>Next steps</h2>
        <p>This is a demo checkout — no payment is collected here. Click below to place your order.</p>
        <button type="submit" class="button primary checkout-place-order">Place Order</button>
      </div>
    </form>
  </div>
  <div class="checkout-confirmation" hidden>
    <h2>Thank you!</h2>
    <p>Your order <strong class="checkout-order-id"></strong> has been placed.</p>
    <a class="button primary" href="/">Back to home</a>
  </div>
</div>
